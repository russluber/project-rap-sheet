name: CI

# Run the linter and the test suite on every push and pull request to main.
#
# Documentation-only changes skip CI. Every code or data change runs the full
# suite: annotations and generated outputs are part of the released data product,
# and tests verify that committed processed files exactly match a fresh rebuild.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.17"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install dev dependencies
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check --output-format=github .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.17"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install package with dev dependencies
        run: uv sync --locked
      - name: Pytest
        run: uv run pytest -q
      - name: Verify committed data release
        run: uv run fliptop-verify-release
      - name: Verify lockfile
        run: uv lock --check
