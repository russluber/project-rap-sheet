name: CI

# Run the linter and the test suite on every push and pull request to main.
#
# paths-ignore skips CI for changes that can't affect code or tests: the
# hand-entered annotations store (fliptop-annotate output), the generated
# processed outputs, and docs. Note it does NOT skip data/raw/, emcee_aliases.csv,
# or data/overrides/ - those feed the build and are covered by tests, so a change
# there should still be checked.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/annotations/**'
      - 'data/processed/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'data/annotations/**'
      - 'data/processed/**'
      - '**/*.md'

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.17"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install dev dependencies
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check --output-format=github .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.17"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install package with dev dependencies
        run: uv sync --locked
      - name: Pytest
        run: uv run pytest -q
