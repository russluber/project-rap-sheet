name: CI

# Run the linter and the test suite on every push and pull request to main.
#
# paths-ignore skips CI for changes that can't affect code or tests: the
# hand-entered annotations store (fliptop-annotate output), the generated
# processed outputs, and docs. Note it does NOT skip data/raw/, emcee_aliases.csv,
# or data/overrides/ - those feed the build and are covered by tests, so a change
# there should still be checked.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/annotations/**'
      - 'data/processed/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'data/annotations/**'
      - 'data/processed/**'
      - '**/*.md'

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check --output-format=github .

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q
