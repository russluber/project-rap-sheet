name: fliptop-analysis
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - cython
  - ca-certificates
  - openssl
  - pandas
  - numpy
  - python-dateutil
  - isodate
  - openpyxl
  - matplotlib
  - seaborn
  - plotly
  - jupyterlab
  - ipykernel
  - beautifulsoup4
  - requests
  - scikit-learn
  - networkx
  - lifelines
  - scikit-survival
  - pyvis
  - pandoc
  - pytest
  - pip
  - pip:
      # Install the fliptop package itself in editable mode so notebooks/scripts
      # can `import fliptop` without sys.path hacks.
      - -e .
