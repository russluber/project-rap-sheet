[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fliptop"
version = "0.1.0"
description = "Reproducible data pipeline for cleaning and analyzing FlipTop rap battle data."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Russel Luber" }]
dependencies = [
    "pandas",
    "numpy",
    "isodate",
    "python-dateutil",
    "networkx",
    "beautifulsoup4",
    "requests",
    "openpyxl",
]

[project.optional-dependencies]
# Analysis / notebook extras kept separate from the core pipeline.
analysis = [
    "matplotlib",
    "seaborn",
    "plotly",
    "jupyterlab",
    "ipykernel",
    "scikit-learn",
    "lifelines",
    "scikit-survival",
    "pyvis",
]
# Developer tooling (tests + lint). Kept out of the runtime and analysis installs.
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
fliptop-refresh = "fliptop.refresh:main"
fliptop-annotate = "fliptop.annotate:main"

[tool.setuptools]
packages = ["fliptop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Research notebooks carry exploratory imports / long cells; don't lint them.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# A focused, high-signal set: pyflakes/pycodestyle for real errors, isort for
# import order, and bugbear/comprehension/simplify/pyupgrade for consistency.
select = ["E", "F", "W", "I", "B", "C4", "SIM", "UP"]
ignore = [
    "E501",  # long lines are mostly prose in docstrings/comments; not worth reflowing
    "B905",  # zip() strict=: the zipped sequences are equal-length by construction here
    "B023",  # loop-variable closures below are invoked within the same iteration (safe)
]
